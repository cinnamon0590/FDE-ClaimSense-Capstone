# ClaimSense eval gate + design checks: change control from M0.
#
# M0: validate the eval suite (shape, coverage, computed facts) and score the legacy baseline.
# M1: the synthetic fixtures must equal what the generator produces from the eval cases (no drift),
#     the data must validate, and the data-boundary contract tests must pass.
# M2 (W15): the orchestrator image is built ONCE (build-image); the scan, the container checks and the LIVE
#           LLM-required eval gate all test that exact build, and push-image ships that same build (same image id,
#           no rebuild) only if every job passes and the repo variable ECR_PUSH_ENABLED is "true" (D-035).
#           Gate: overall >= EVAL_THRESHOLD (90, never lower), adversarial = 100%, every case decided by the model.
#           The replay-brain run on every PR is a $0 harness regression check, not the gate.
name: eval-gate
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval-suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]   # brief minimum + the project venv's version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate eval suite (fails on any shape, coverage or computed-fact error)
        working-directory: M0/evals
        run: python3 -I validate_cases.py
      - name: Harness self-tests (gate passes a perfect system, blocks injection / leakage / fallback)
        working-directory: M0/evals
        run: python3 test_harness.py -v
      - name: Score legacy rule-table baseline (informational; expected to be BLOCKED)
        working-directory: M0/evals
        run: python3 -I score.py --verbose || echo "baseline is below the gate, as expected"

  design-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]   # brief minimum + the project venv's version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fixtures match the generator (no drift from the eval cases)
        working-directory: M1/6-synthetic-data
        run: |
          python3 -I generate_fixtures.py
          git diff --exit-code -- fixtures/ || { echo "fixtures differ from generator output; regenerate and commit"; exit 1; }
      - name: Validate synthetic data (schemas, integrity, M0-case consistency, clause provenance)
        working-directory: M1/6-synthetic-data
        run: python3 -I validate_data.py
      - name: Data-boundary contract tests (idempotency, human-only confirm, anti-enumeration, audit)
        working-directory: M1/5-system-contracts
        run: python3 test_contracts.py -v
      - name: Guardrail tests (G1-G7 on the M0 adversarial cases, graded by the M0 scorer)
        working-directory: M1/2-architecture
        run: python3 test_guardrails.py -v
      - name: Pricing, stack and topology tools run
        working-directory: M1/tools
        run: |
          python3 -I pricing.py > /dev/null
          python3 -I stack_matrix.py > /dev/null
          python3 -I topology.py > /dev/null

  pipeline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: M2/requirements.txt
      - name: Install M2 dependencies
        run: pip install -r M2/requirements.txt
      - name: Validate the M2 eval additions (CS-021..CS-040)
        working-directory: M0/evals
        run: python3 -I validate_cases.py ../../M2/evals/cases-m2.json
      - name: Unit + integration tests (typed outputs, tripwires, retrieval, fallback labelling, gate)
        working-directory: M2
        run: python3 -m pytest -q tests
      - name: HARNESS REGRESSION (replay brain = recorded model outputs, 150 cases, $0; NOT the LLM gate, which is live-eval)
        working-directory: M2
        env:
          CLAIMSENSE_LLM_REQUIRED: "false"
        run: python3 evals/run_evals.py --brain replay --out evals/results-ci-${{ matrix.python-version }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-replay-${{ matrix.python-version }}
          path: M2/evals/results-ci-*.txt

  build-image:
    # Build the orchestrator image ONCE (D-035). Every gate below tests THIS build and push-image pushes THIS build:
    # same image id end to end, never a second rebuild after the gate.
    runs-on: ubuntu-latest
    outputs:
      image_id: ${{ steps.build.outputs.image_id }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        name: "Build the orchestrator image (single-platform manifest, no attestations - Lambda rejects image indexes)"
        run: |
          # public.ecr.aws throttles anonymous pulls ("toomanyrequests"): retry the build with backoff (D-048)
          for attempt in 1 2 3 4; do
            docker build --provenance=false --platform linux/amd64 -f M2/services/orchestrator/Dockerfile \
              -t claimsense/orchestrator:ci . && break
            [ "$attempt" = 4 ] && exit 1
            echo "build attempt $attempt failed (registry throttling?); retrying in $((attempt * 30))s"; sleep $((attempt * 30))
          done
          id=$(docker inspect -f '{{.Id}}' claimsense/orchestrator:ci)
          echo "image_id=$id" >> "$GITHUB_OUTPUT"
          echo "built claimsense/orchestrator image id \`$id\` - the build every gate tests and the push ships" >> "$GITHUB_STEP_SUMMARY"
          docker save claimsense/orchestrator:ci | gzip -1 > orchestrator-image.tar.gz
      - uses: actions/upload-artifact@v4
        with: { name: orchestrator-image, path: orchestrator-image.tar.gz, retention-days: 3 }

  stack-smoke:
    needs: [build-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with: { name: orchestrator-image }
      - name: Load THE build under test (and prove it is the one build-image produced)
        run: |
          gunzip -c orchestrator-image.tar.gz | docker load
          test "$(docker inspect -f '{{.Id}}' claimsense/orchestrator:ci)" = "${{ needs.build-image.outputs.image_id }}"
      - name: Start the whole stack on THE build (other services built here; the orchestrator is never rebuilt)
        working-directory: M2
        run: |
          docker tag claimsense/orchestrator:ci claimsense/orchestrator:local
          docker compose -f docker-compose.yml -f restart-test.compose.yml build mock-systems boundary console
          docker compose -f docker-compose.yml -f restart-test.compose.yml up -d --wait --no-build
      - name: One claim per outcome through the running containers
        run: pip install httpx==0.28.1 && python3 M2/evals/stack_smoke.py
      - name: All 40 eval cases through the containers, retrieval served by the OpenSearch RAG store (D-033)
        run: python3 M2/evals/container_eval.py
      - name: Restart survival - kill the orchestrator mid-claim, restart the boundary twice (D-027)
        run: python3 M2/evals/restart_survival.py
      - name: RBAC - role-to-claim hand-offs and JWT identity on the running containers (D-030)
        run: python3 M2/evals/rbac_check.py
      - name: Wiring - agent <-> OpenSearch RAG store <-> mock claims API; non-root + HEALTHCHECK per container (D-033)
        run: python3 M2/evals/wiring_check.py
      - name: Logs on failure
        if: failure()
        working-directory: M2
        run: docker compose -f docker-compose.yml -f restart-test.compose.yml logs --tail=200
      - name: Tear down
        if: always()
        working-directory: M2
        run: docker compose -f docker-compose.yml -f restart-test.compose.yml down -v

  m3-door:
    # M3 (D-036..039): the governed MCP door, deny-by-default grants, OBO, the 4th backend + webhooks, the audit trail.
    # Offline proofs first ($0, no containers), then the M3 stack on THE tested orchestrator build, every check
    # through the door, and M2's container suites re-run with every agent data access going through /mcp.
    needs: [build-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: M2/requirements.txt
      - run: pip install -r M2/requirements.txt
      - name: M3 unit tests (grants, door gates, MCP protocol, OAuth resource server, OBO, webhooks, pipeline via /mcp)
        run: python3 -m pytest -q M3/tests
      - name: "What the grader runs: a bare `pytest -q` from the repo root (M0 to M3 in one process)"
        run: python3 -m pytest -q
      - name: The two-analyst test (the M3 acceptance criterion) and every door proof, offline
        env: { PYTHONPATH: "M2:M3/door" }
        run: |
          python3 -m claimsense_door.two_analyst_test
          python3 -m claimsense_door.two_analyst_test --viewer
          python3 -m claimsense_door.proofs
          python3 -m claimsense_door.stdio --selftest
      - uses: actions/download-artifact@v4
        with: { name: orchestrator-image }
      - name: Load THE build under test (and prove it is the one build-image produced)
        run: |
          gunzip -c orchestrator-image.tar.gz | docker load
          test "$(docker inspect -f '{{.Id}}' claimsense/orchestrator:ci)" = "${{ needs.build-image.outputs.image_id }}"
      - name: Start the M3 stack on THE build (door, ticketing, mock systems, OpenSearch, console; orchestrator not rebuilt)
        working-directory: M3
        run: |
          docker tag claimsense/orchestrator:ci claimsense/orchestrator:local
          docker compose build mock-systems boundary ticketing console
          MOCK_BRAIN=1 docker compose up -d --wait --no-build
      - name: M2 suites through the MCP door (one claim per outcome; all 150 cases)
        run: |
          pip install httpx==0.28.1
          python3 M2/evals/stack_smoke.py
          python3 M2/evals/container_eval.py
      - name: D-2 every route refuses a bad token · D-3 refusal before any agent · stretch webhooks · interop · D-5 audit
        working-directory: M3
        run: |
          python3 evals/route_auth_check.py
          python3 evals/refusal_before_agents.py
          python3 evals/webhook_check.py
          python3 evals/mcp_interop_check.py
          python3 evals/audit_check.py
          PYTHONPATH=../M2:door python3 -m claimsense_door.two_analyst_test --url http://localhost:8002
          python3 evals/viewer_week4_check.py
      - name: "RBAC hand-offs through the door (last: it moves claims between groups)"
        run: python3 M2/evals/rbac_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-evidence
          path: M3/evidence/
      - name: Logs on failure
        if: failure()
        working-directory: M3
        run: docker compose logs --tail=200
      - name: Tear down
        if: always()
        working-directory: M3
        run: docker compose down -v

  live-eval:
    # THE GATE (D-035): run INSIDE the exact image that will be pushed, live models, LLM REQUIRED. The rule engine
    # never counts as a pass; a missing or invalid key turns it red. Main, demo/* and manual runs.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/demo/')))
    needs: [pipeline-tests, build-image]
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}     # from GitHub secrets only; passed by name, never echoed
      EVAL_THRESHOLD: ${{ vars.EVAL_THRESHOLD || '90' }}  # may be raised; the runner refuses anything below 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: orchestrator-image }
      - name: Load THE build under test (and prove it is the one build-image produced)
        run: |
          gunzip -c orchestrator-image.tar.gz | docker load
          test "$(docker inspect -f '{{.Id}}' claimsense/orchestrator:ci)" = "${{ needs.build-image.outputs.image_id }}"
      - name: EVAL GATE in THE image (live, pinned models, LLM required, ALL 150 cases incl. every adversarial family, ~$3.70)
        # M4 (D-046): the full suite runs live on every merge to main, so the submitted commit carries its own run. The
        # 3-run release gate is still run by hand before a release (python M2/evals/run_evals.py --repeat 3).
        run: |
          docker run --rm -e OPENAI_API_KEY -e EVAL_THRESHOLD -e MOCK_BRAIN=0 -e CLAIMSENSE_LLM_REQUIRED=true \
            -v "$PWD/M2/evals/run_evals.py:/app/M2/evals/run_evals.py:ro" \
            --entrypoint python claimsense/orchestrator:ci /app/M2/evals/run_evals.py --suite full --concurrency 6 \
            --out /tmp/results.txt | tee results-ci-live.txt
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-live
          path: results-ci-live.txt

  second-grader:
    # M4 (D-047): grader #2 is Promptfoo. The agreement runner replays all 150 golden cases through the real pipeline
    # ($0) and must agree with the gate 150/150 on every push; on main the rubric grader also judges 7 LIVE decision
    # cards (clean, referral, every adversarial family) with the calibrated judge. Both graders green or nothing ships.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: M2/requirements.txt }
      - run: python -m venv .venv && .venv/bin/pip install -q -r M2/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: "22.22" }
      - name: Agreement runner (Promptfoo, 150 golden cases, replay brain, $0)
        working-directory: M4/evals/promptfoo
        env: { PROMPTFOO_DISABLE_TELEMETRY: "1", PROMPTFOO_DISABLE_UPDATE: "1", CLAIMSENSE_BRAIN: replay }
        run: npx -y promptfoo@0.125.0 eval -c promptfoo-golden.yaml --no-cache -j 4 --no-progress-bar -o agreement.json
      - name: Rubric grader (Promptfoo, 7 live cards, calibrated judge, ~$0.25; main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: M4/evals/promptfoo
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROMPTFOO_DISABLE_TELEMETRY: "1"
          PROMPTFOO_DISABLE_UPDATE: "1"
          CLAIMSENSE_BRAIN: live
          MOCK_BRAIN: "0"
          CLAIMSENSE_LLM_REQUIRED: "true"
        run: npx -y promptfoo@0.125.0 eval -c promptfoo.yaml --no-cache -j 3 --no-progress-bar -o rubric.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: second-grader, path: "M4/evals/promptfoo/*.json" }

  supply-chain:
    # OWASP LLM03: scan THE build that will be pushed; publish its SBOM. A HIGH/CRITICAL CVE with a fix blocks the push.
    needs: [build-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: orchestrator-image }
      - name: Load THE build under test (and prove it is the one build-image produced)
        run: |
          gunzip -c orchestrator-image.tar.gz | docker load
          test "$(docker inspect -f '{{.Id}}' claimsense/orchestrator:ci)" = "${{ needs.build-image.outputs.image_id }}"
      - name: Vulnerability gate (Trivy, pinned) - HIGH/CRITICAL with a fix available = fail
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 claimsense/orchestrator:ci
      - name: SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" aquasec/trivy:0.57.1 image \
            --format cyclonedx --output /out/claimsense-orchestrator.cdx.json claimsense/orchestrator:ci
          echo "SBOM components: $(python3 -c 'import json;print(len(json.load(open("sbom/claimsense-orchestrator.cdx.json"))["components"]))')" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-claimsense-orchestrator
          path: sbom/claimsense-orchestrator.cdx.json

  push-image:
    # Pushes THE build that passed every gate (same image id), only when all are green AND the repo variable
    # ECR_PUSH_ENABLED is "true". Any failure upstream -> skipped -> no image. AWS via GitHub OIDC (no stored keys).
    needs: [build-image, eval-suite, design-checks, pipeline-tests, stack-smoke, m3-door, supply-chain, live-eval, second-grader]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/demo/')) && vars.ECR_PUSH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: orchestrator-image }
      - name: Load THE build under test (and prove it is the one build-image produced)
        run: |
          gunzip -c orchestrator-image.tar.gz | docker load
          test "$(docker inspect -f '{{.Id}}' claimsense/orchestrator:ci)" = "${{ needs.build-image.outputs.image_id }}"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: us-east-1
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true
      - name: Push THE gated build (tag = commit SHA; tags are immutable) and record its digest
        env:
          REPO: ${{ steps.ecr.outputs.registry }}/claimsense/orchestrator
        run: |
          docker tag claimsense/orchestrator:ci "$REPO:${GITHUB_SHA}"
          docker push "$REPO:${GITHUB_SHA}"
          digest=$(docker inspect -f '{{index .RepoDigests 0}}' "$REPO:${GITHUB_SHA}")
          echo "pushed claimsense/orchestrator:${GITHUB_SHA} · digest \`${digest##*@}\` · image id \`${{ needs.build-image.outputs.image_id }}\` (the build that passed the scan, the stack smoke and the live gate; not rebuilt)" >> "$GITHUB_STEP_SUMMARY"
