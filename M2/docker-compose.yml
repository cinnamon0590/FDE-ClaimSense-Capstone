# ClaimSense local stack: one command brings up all five services (the RAG store included, D-033).
#   cd M2 && docker compose up --build        (or: make up)
# Console: http://localhost:8510 · Orchestrator API: http://localhost:8003/docs · Boundary: http://localhost:8002/docs
# No key needed: with OPENAI_API_KEY unset (or MOCK_BRAIN=1) the orchestrator uses the replay brain ($0).
name: claimsense

x-platform: &platform
  build: { context: .., dockerfile: M2/services/platform.Dockerfile }
  image: claimsense/platform:local
  restart: unless-stopped

services:
  mock-systems:
    <<: *platform
    command: ["uvicorn", "mock_systems.app:app", "--host", "0.0.0.0", "--port", "8001"]
    healthcheck: &hc
      test: ["CMD", "python", "-c", "import urllib.request,os;urllib.request.urlopen('http://localhost:'+os.environ['PORT']+'/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment: { PORT: "8001" }
    expose: ["8001"]                       # internal only: only the boundary talks to the systems of record

  boundary:
    <<: *platform
    command: ["uvicorn", "boundary.app:app", "--host", "0.0.0.0", "--port", "8002"]
    # CLAIMSENSE_DEV_ISSUER: the local stand-in for Cognito's hosted login (synthetic sandbox only, D-030)
    environment: { PORT: "8002", SYSTEMS_URL: "http://mock-systems:8001", AUDIT_LOG: /state/audit.jsonl,
                   CLAIMSENSE_DEV_ISSUER: "1" }
    volumes: ["state:/state"]
    ports: ["127.0.0.1:8002:8002"]
    healthcheck: *hc
    depends_on: { mock-systems: { condition: service_healthy } }

  # The RAG store (W15 "Set up local RAG"): the policy corpus indexed in a local OpenSearch. Internal network only;
  # the security plugin is off because nothing outside this compose network can reach it (AWS: Amazon OpenSearch
  # with IAM, M3). The orchestrator builds the index on first start (idempotent, keyed by a corpus hash).
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits: { nofile: { soft: 65536, hard: 65536 } }
    expose: ["9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  orchestrator:
    build: { context: .., dockerfile: M2/services/orchestrator/Dockerfile }
    image: claimsense/orchestrator:local
    restart: unless-stopped
    env_file: [{ path: .env, required: false }]
    environment:
      BOUNDARY_URL: http://boundary:8002
      OPENSEARCH_URL: http://opensearch:9200       # the service name, never localhost
      MOCK_BRAIN: ${MOCK_BRAIN:-1}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai}    # overridable from the shell: MODEL_PROVIDER=bedrock docker compose up
    volumes: ["state:/state"]
    # 8003 = ClaimSense's port; 8080 = AgentCore Runtime's (so `curl -s localhost:8080/ping` works as in the brief)
    ports: ["127.0.0.1:8003:8003", "127.0.0.1:8080:8003"]
    depends_on: { boundary: { condition: service_healthy }, opensearch: { condition: service_healthy } }

  console:
    build: { context: .., dockerfile: M2/services/console/Dockerfile }
    image: claimsense/console:local
    restart: unless-stopped
    environment: { ORCHESTRATOR_URL: "http://orchestrator:8003", BOUNDARY_URL: "http://boundary:8002" }
    ports: ["127.0.0.1:8510:8501"]
    depends_on: { orchestrator: { condition: service_healthy } }

volumes:
  state: {}
